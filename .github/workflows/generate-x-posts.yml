name: Generate X Post Drafts

on:
  schedule:
    # 08:00 JST = 23:00 UTC on the previous day.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  generate:
    name: Generate post drafts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate X post drafts
        run: npm run generate:x-posts
